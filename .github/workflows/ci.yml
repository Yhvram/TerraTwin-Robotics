name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and resolve dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-pytest python3-rosdep
          rosdep update || true
          source /opt/ros/lyrical/setup.bash
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y

      - name: Build
        shell: bash
        working-directory: ros2_ws
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --event-handlers console_direct+

      - name: Test
        shell: bash
        working-directory: ros2_ws
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  dependency-check:
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check Lyrical package availability
        shell: bash
        run: |
          apt-get update
          ROS_DISTRO=lyrical bash scripts/check_lyrical_deps.sh
